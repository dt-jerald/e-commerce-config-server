spring:
  datasource:
  url: jdbc:mysql://localhost:3306/product_service_db
  username: root
  password: Jerald@123!

  show-sql : true
  properties:
      hibernate:
        dialect : org.hibernate.dialect.MySQLDialect

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  retry:
    instances:
      INVENTORY-SERVICE:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
      CATEGORY-SERVICE:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true

  circuitbreaker:
    instances:
      INVENTORY-SERVICE:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
      CATEGORY-SERVICE:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
