spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cart_service_db
    username: root
    password: Jerald@123!

  jpa:
    hibernate:
      ddl-auto: update

    show-sql : true
    properties:
      hibernate:
        dialect : org.hibernate.dialect.MySQLDialect

resilience4j:
  retry:
    instances:
      INVENTORY-SERVICE:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
      PRODUCT-SERVICE:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true

  circuitbreaker:
    instances:
      INVENTORY-SERVICE:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
      PRODUCT-SERVICE:
        sliding-window-size: 5
        failure-rate-threshold: 50
